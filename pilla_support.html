  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: auto; line-height: 1.6; }
    .lang-switch { margin-bottom: 20px; }
    .lang-switch button { margin-right: 8px; padding: 5px 10px; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Språkvelger -->
  <div class="lang-switch">
    <button onclick="setLang('no')">🇳🇴 Norsk</button>

      const t = translations[lang];
      document.getElementById("title").innerHTML = t.title;
      document.getElementById("welcome").innerHTML = t.welcome;
      document.getElementById("contact_title").innerHTML = t.contact_title;
      document.getElementById("contact_text").innerHTML = t.contact_text;
      document.getElementById("faq_title").innerHTML = t.faq_title;
      document.getElementById("faq1").innerHTML = t.faq1;
      document.getElementById("faq2").innerHTML = t.faq2;
      document.getElementById("privacy_title").innerHTML = t.privacy_title;
      document.getElementById("privacy_text").innerHTML = t.privacy_text;

    // Sett standard språk til norsk
    setLang('no');
